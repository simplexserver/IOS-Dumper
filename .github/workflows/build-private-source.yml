name: SimpleX Toolkit iOS Runtime Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "BUILD_TRIGGER"

permissions:
  contents: write

concurrency:
  group: simplex-toolkit-public-builder
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    name: Build private source and publish binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Require private source read token
        env:
          SOURCE_TOKEN: ${{ secrets.DUMPER_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::Missing repository secret DUMPER_SOURCE_TOKEN. Add a fine-grained token with Contents: Read access to simplexserver/Dumper-Build."
            exit 1
          fi

      - name: Validate private source repository access
        env:
          SOURCE_TOKEN: ${{ secrets.DUMPER_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/source-version.json" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $SOURCE_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/simplexserver/Dumper-Build/contents/VERSION?ref=main")"
          if [[ "$STATUS" != "200" ]]; then
            echo "::error::DUMPER_SOURCE_TOKEN cannot read Dumper-Build/VERSION (HTTP $STATUS). Check token owner, selected repository, Contents: Read permission, approval, and expiry."
            exit 1
          fi
          echo "Private source contents permission verified."

      - name: Checkout public release repository
        uses: actions/checkout@v4
        with:
          repository: simplexserver/IOS-Dumper
          ref: main
          token: ${{ github.token }}
          path: release
          fetch-depth: 0

      - name: Checkout private source repository
        uses: actions/checkout@v4
        with:
          repository: simplexserver/Dumper-Build
          ref: main
          token: ${{ secrets.DUMPER_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Read and validate release version
        id: version
        working-directory: source
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building SimpleX Toolkit $VERSION from $(git rev-parse HEAD)"

      - name: Verify branded source and vendored dependencies
        working-directory: source
        run: |
          set -euo pipefail
          python3 tools/brand_project.py
          test -s LICENSE
          test -s Theos/Makefile
          test -s Theos/control
          test -s Theos/SimpleXDumper.plist
          test -s Dumper/main_ios.mm
          test -s Dumper/UI/iOS/KittyFilePreviewController.h
          test -s Dumper/UI/iOS/KittyFilePreviewController.mm
          test -s Dumper/Engine/Unity/UnityMetadataDumper.cpp
          test -s Dumper/Engine/Unity/UnityMetadataIndex.h
          test -s Dumper/Engine/Unity/UnityMetadataIndex.cpp
          test -s Dumper/Engine/Unity/UnityRuntimeDumper.cpp
          test -s tests/unity_metadata_test.cpp
          test -s Dumper/Engine/Unity/Runtime/Dumper.cpp
          test -s Dumper/Engine/Unity/Runtime/Il2cpp.cpp
          test -s Dumper/Engine/Unity/Runtime/THIRD_PARTY_NOTICES.md
          test -s Dumper/DumperMain.h
          test -s libs/KittyMemory/KittyMemory/MemoryPatch.cpp
          test -s libs/KittyMemoryEx/KittyMemoryEx/MemoryPatch.cpp
          grep -Fq 'SimpleX Toolkit' Dumper/main_ios.mm
          grep -Fq 'Unreal Engine 4 Dumper' Dumper/main_ios.mm
          grep -Fq 'Unity IL2CPP Dumper' Dumper/main_ios.mm
          grep -Fq 'LogStartupDiagnostics' Dumper/main_ios.mm
          grep -Fq 'contextMenuConfigurationForRowAtIndexPath' Dumper/UI/iOS/KittyFileBrowser.mm
          grep -Fq 'showGameFilesInView' Dumper/UI/iOS/KittyFileBrowser.mm
          grep -Fq 'itemsForBeginningDragSession' Dumper/UI/iOS/KittyFileBrowser.mm
          grep -Fq 'promptCreateItemIsDirectory' Dumper/UI/iOS/KittyFileBrowser.mm
          grep -Fq 'applySearchHighlights' Dumper/UI/iOS/KittyFilePreviewController.mm
          grep -Fq 'findNextMatch' Dumper/UI/iOS/KittyFilePreviewController.mm
          grep -Fq 'readOnlyMode' Dumper/UI/iOS/KittyFilePreviewController.mm
          grep -Fq 'QuickLook' Theos/Makefile
          grep -Fq 'Supported engines: UE4 • Unity IL2CPP' Dumper/main_ios.mm
          grep -Fq 'kTripletSectionCount = 31' Dumper/Engine/Unity/UnityMetadataDumper.cpp
          grep -Fq 'DumpLegacyMetadataIndexV23' Dumper/Engine/Unity/UnityMetadataIndex.cpp
          grep -Fq 'metadata-only fallback' Dumper/Engine/Unity/UnityRuntimeDumper.cpp
          ! grep -Fq 'Discord / Credits' Dumper/main_ios.mm
          grep -Fq 'https://discord.gg/Kr2pvPfEUR' Dumper/main_ios.mm
          grep -Fq 'SimpleXToolkit.log' Dumper/DumperMain.cpp
          grep -Fq 'OutputRoot / "Dump"' Dumper/Generator/Generators/Generator.cpp
          grep -Fq 'UnityRoot / "Dump"' Dumper/main_ios.mm
          ! grep -Fq 'Dump_' Dumper/Generator/Generators/Generator.cpp
          grep -Fq '1.3.1' VERSION
          echo "Source, branding, UE4, Unity runtime, vendored dependencies, and credits checks passed."

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 lld-18 llvm-18 llvm-18-tools \
            libc++-18-dev libc++abi-18-dev dpkg-dev fakeroot \
            perl python3 git curl unzip xz-utils file rsync
          make --version | head -1

      - name: Run Unity metadata parser regression tests
        working-directory: source
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -I Dumper/Engine/Unity \
            Dumper/Engine/Unity/UnityMetadataDumper.cpp \
            Dumper/Engine/Unity/UnityMetadataIndex.cpp \
            tests/unity_metadata_test.cpp \
            -o /tmp/simplex-unity-metadata-test
          /tmp/simplex-unity-metadata-test

      - name: Install Theos and Linux Mach-O toolchain
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          test -f "$HOME/theos/makefiles/common.mk"

          TOOLCHAIN_BIN="$HOME/theos/toolchain/linux/iphone/bin"
          mkdir -p "$TOOLCHAIN_BIN"
          LLVM_BIN="/usr/lib/llvm-18/bin"
          test -x "$LLVM_BIN/clang"
          test -x "$LLVM_BIN/clang++"

          for tool in clang clang++ cc c++; do
            ln -sf "$LLVM_BIN/$tool" "$TOOLCHAIN_BIN/$tool"
          done
          for tool in llvm-ar llvm-ranlib llvm-nm llvm-objdump llvm-strip llvm-lipo; do
            if [[ -x "$LLVM_BIN/$tool" ]]; then
              ln -sf "$LLVM_BIN/$tool" "$TOOLCHAIN_BIN/$tool"
            fi
          done

          LD64_BIN="$LLVM_BIN/ld64.lld"
          test -x "$LD64_BIN"
          "$LD64_BIN" --version
          ln -sf "$LD64_BIN" "$TOOLCHAIN_BIN/ld64.lld"
          ln -sf "$TOOLCHAIN_BIN/ld64.lld" "$TOOLCHAIN_BIN/ld"

          test -x "$TOOLCHAIN_BIN/clang"
          "$TOOLCHAIN_BIN/clang" --version | head -1
          "$TOOLCHAIN_BIN/ld64.lld" --version
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          SDK_SOURCE="$RUNNER_TEMP/theos-sdks"
          rm -rf "$SDK_SOURCE"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_SOURCE"
          git -C "$SDK_SOURCE" sparse-checkout set iPhoneOS16.5.sdk
          test -d "$SDK_SOURCE/iPhoneOS16.5.sdk"
          ln -s "$SDK_SOURCE/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS16.5.sdk"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build rootless package with Theos
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd source/Theos
          make clean
          if ! make package FINALPACKAGE=1 DEBUG=0 > "$GITHUB_WORKSPACE/dist/SimpleXDumper-build.log" 2>&1; then
            echo "::error::Theos build failed; the final build output is shown below."
            tail -n 80 "$GITHUB_WORKSPACE/dist/SimpleXDumper-build.log"
            exit 1
          fi
          echo "Theos build completed successfully. Full compiler output was not published."

          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          [[ "$(dpkg-deb -f "$DEB" Package)" == "com.simplex.simplexdumper" ]]
          [[ "$(dpkg-deb -f "$DEB" Version)" == "$VERSION" ]]

          ROOTFS="$RUNNER_TEMP/simplexdumper-rootfs"
          rm -rf "$ROOTFS"
          mkdir -p "$ROOTFS"
          dpkg-deb -x "$DEB" "$ROOTFS"
          DYLIB="$(find "$ROOTFS" -type f -name 'SimpleXDumper.dylib' -print -quit)"
          test -n "$DYLIB"

          cp "$DYLIB" "$GITHUB_WORKSPACE/dist/SimpleXDumper-v${VERSION}.dylib"
          cp "$DEB" "$GITHUB_WORKSPACE/dist/SimpleXDumper.deb"
          cp "$GITHUB_WORKSPACE/source/CHANGELOG.md" "$GITHUB_WORKSPACE/dist/CHANGELOG.md"
          printf 'VERSION=%s\nSOURCE_SHA=%s\n' "$VERSION" "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" > "$GITHUB_WORKSPACE/dist/BUILD_INFO.txt"

      - name: Verify Mach-O, architecture, and package identity
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          DYLIB="dist/SimpleXDumper-v${VERSION}.dylib"
          file "$DYLIB"
          llvm-lipo -info "$DYLIB"
          file "$DYLIB" | grep -q 'Mach-O'
          llvm-lipo -archs "$DYLIB" | grep -qw arm64
          [[ "$(dpkg-deb -f dist/SimpleXDumper.deb Package)" == "com.simplex.simplexdumper" ]]
          [[ "$(dpkg-deb -f dist/SimpleXDumper.deb Version)" == "${{ steps.version.outputs.value }}" ]]
          strings "$DYLIB" | grep -Fq 'SimpleXDumper'
          if strings "$DYLIB" | grep -Fq 'MobileDumper-7'; then
            echo "::error::A stale product string remains in the dylib"
            exit 1
          fi
          sha256sum "$DYLIB" dist/SimpleXDumper.deb > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload binary-only build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleXToolkit-iOS-v${{ steps.version.outputs.value }}-${{ github.run_number }}
          path: |
            dist/SimpleXDumper-v${{ steps.version.outputs.value }}.dylib
            dist/SimpleXDumper.deb
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Latest and version archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$GITHUB_WORKSPACE/release"
          mkdir -p "$RELEASE_DIR/Latest" "$RELEASE_DIR/Archive/v$VERSION"
          find "$RELEASE_DIR/Latest" -maxdepth 1 -type f -delete
          rm -rf "$RELEASE_DIR/Archive/v$VERSION"
          mkdir -p "$RELEASE_DIR/Archive/v$VERSION"

          DYLIB_NAME="SimpleXDumper-v${VERSION}.dylib"
          cp "dist/$DYLIB_NAME" "$RELEASE_DIR/Latest/$DYLIB_NAME"
          cp "dist/$DYLIB_NAME" "$RELEASE_DIR/Archive/v$VERSION/$DYLIB_NAME"
          cp dist/SimpleXDumper.deb "$RELEASE_DIR/Latest/"
          cp dist/SimpleXDumper.deb "$RELEASE_DIR/Archive/v$VERSION/"
          cp dist/CHANGELOG.md "$RELEASE_DIR/Archive/v$VERSION/CHANGELOG.md"
          cp source/VERSION "$RELEASE_DIR/VERSION"

          python3 - "$RELEASE_DIR/README.md" "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          readme = Path(sys.argv[1])
          version = sys.argv[2]
          content = readme.read_text(encoding="utf-8")
          content = re.sub(r"\*\*SimpleX Toolkit v[^*]+\*\*", f"**SimpleX Toolkit v{version}**", content, count=1)
          content = re.sub(r"Archive/v[0-9.]+/CHANGELOG\.md", f"Archive/v{version}/CHANGELOG.md", content)
          content = re.sub(r"Latest/SimpleXDumper(?:-v[0-9.]+)?\.dylib",
                           f"Latest/SimpleXDumper-v{version}.dylib", content)
          content = re.sub(r"Archive/v[0-9.]+/SimpleXDumper(?:-v[0-9.]+)?\.dylib",
                           f"Archive/v{version}/SimpleXDumper-v{version}.dylib", content)
          readme.write_text(content, encoding="utf-8")
          PY

          git -C "$RELEASE_DIR" config user.name "github-actions[bot]"
          git -C "$RELEASE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RELEASE_DIR" add Latest Archive/v"$VERSION" VERSION README.md
          if ! git -C "$RELEASE_DIR" diff --cached --quiet; then
            git -C "$RELEASE_DIR" commit -m "Publish SimpleX Toolkit v$VERSION"
            git -C "$RELEASE_DIR" push origin main
          fi

          {
            echo "## SimpleXDumper build published"
            echo ""
            echo "- Version: $VERSION"
            echo "- Source commit: $(git -C source rev-parse HEAD)"
            echo "- Release repository: simplexserver/IOS-Dumper"
          } >> "$GITHUB_STEP_SUMMARY"
